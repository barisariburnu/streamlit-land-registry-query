services:
  streamlit-land-registry-query:
    build: .
    container_name: streamlit-land-registry-query
    restart: always
    ports:
      - "8502:8502"
    volumes:
      - .:/usr/src/app
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - TZ=UTC
